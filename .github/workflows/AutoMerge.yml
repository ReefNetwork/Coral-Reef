name: Auto Merge
on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - plugin.yml
jobs:
  merge:
    name: Merge master to stable
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip]')"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v2

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v3
        id: cpr
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: Auto merge master to stable with Version change
          committer: GitHub <noreply@github.com>
          author: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
          branch: stable
          delete-branch: false
          title: Release New Version
          body: |
            Automatically generated by Github Actions as plugin.yml in the master branch has been updated.
            update by ${{ github.actor }}.
          draft: false

      - name: Merge Pull Request
        run: gh pr merge ${{ steps.cpr.outputs.pull-request-url }} --merge
