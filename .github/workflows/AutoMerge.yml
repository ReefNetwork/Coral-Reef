name: Auto Merge
on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - plugin.yml
jobs:
  merge:
    name: Merge master to stable
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip]')"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v2

      - name: Create pull request
        id: pr
        uses: repo-sync/pull-request@v2
        with:
          destination_branch: stable
          github_token: ${{ secrets.GITHUB_TOKEN }}
          pr_title: Pulling ${{ GITHUB_REF##*/ }} into stable
          pr_body: |
            Automatically generated by Github Actions as plugin.yml in the master branch has been updated.
            update by ${{ github.actor }}.

      - name: Merge pull request
        run: gh pr merge ${{ steps.pr.outputs.pr_url }} --merge

      - name: Run Stable CI
        run: gh workflow run CI.yml --ref stable
