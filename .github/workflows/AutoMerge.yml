name: Auto Merge
on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - plugin.yml
jobs:
  merge:
    name: Merge master to stable
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip]')"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v2
        with:
          ref: stable

      - name: Merge master to stable
        run: git merge master

      - name: Push
        run: git push
