name: CI

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  stable_checker:
    runs-on: ubuntu-latest
    if: "github.ref == 'refs/heads/master' && !contains(github.event.head_commit.message, '[skip]')"
    outputs:
      stable: ${{ steps.filter.outputs.plugin-yml }}
    steps:
      - uses: actions/checkout@v2

      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            plugin-yml:
             - 'plugin.yml'

  merge_stable:
    runs-on: ubuntu-latest
    needs: stable_checker
    if: ${{ needs.stable_checker.outputs.stable == 'true' }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v2
        with:
          ref: stable

      - name: Merge master to stable
        run: |
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git config --global user.name "${{ github.actor }}"
          git fetch
          git merge --allow-unrelated-histories origin/master

      - name: Push
        run: git push origin stable

  # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # #
  #                          ※ <注意> build_debugを変えたらbuild_stableも変えるのを忘れずに                 #
  # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # #

  build_debug:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[ci skip]')"
    steps:
      - uses: actions/checkout@v2

      - name: composer
        run: composer install --no-dev

      - name: build
        run: php -d phar.readonly=0 ./build/make-phar.php ${{ github.run_number }}-${GITHUB_REF##*/}

      - name: virion install
        run: |
          wget https://poggit.pmmp.io/r/152920/libasynql.phar -O libasynql.phar
          php -d phar.readonly=0 libasynql.phar ./build/CoralReef.phar "ree_jp\\coral_reef\\libs\\"
          wget https://poggit.pmmp.io/r/154019/InvMenu.phar -O InvMenu.phar
          php -d phar.readonly=0 InvMenu.phar ./build/CoralReef.phar "ree_jp\\coral_reef\\libs\\"

      - name: LICENSES
        run: |
          mkdir ./build/LICENSES
          mv LICENSES/* ./build/LICENSES/

      - name: upload
        uses: actions/upload-artifact@v2
        with:
          name: CoralReefDebug
          path: |
            ./build/*
            !./build/make-phar.php

  build_stable:
    runs-on: ubuntu-latest
    needs: merge_stable
    if: "!contains(github.event.head_commit.message, '[ci skip]')"
    steps:
      - uses: actions/checkout@v2

      - name: build
        run: php -d phar.readonly=0 ./build/make-phar.php ${{ github.run_number }}-stable

      - name: virion install
        run: |
          wget https://poggit.pmmp.io/r/152920/libasynql.phar -O libasynql.phar
          php -d phar.readonly=0 libasynql.phar ./build/CoralReef.phar "ree_jp\\coral_reef\\libs\\"
          wget https://poggit.pmmp.io/r/154019/InvMenu.phar -O InvMenu.phar
          php -d phar.readonly=0 InvMenu.phar ./build/CoralReef.phar "ree_jp\\coral_reef\\libs\\"

      - name: LICENSES
        run: |
          mkdir ./build/LICENSES
          mv LICENSES/* ./build/LICENSES/

      - name: upload
        uses: actions/upload-artifact@v2
        with:
          name: CoralReef
          path: |
            ./build/*
            !./build/make-phar.php

  deploy_debug:
    environment: deploy debug
    runs-on: ubuntu-latest
    needs: build_debug
    if: github.ref == 'refs/heads/master' || contains(github.event.head_commit.message, '[debug]')
    steps:
      - uses: actions/checkout@v2
      - run: mkdir ~/install_plugins
      - name: download
        uses: actions/download-artifact@v2
        with:
          name: CoralReefDebug
          path: install_plugins

      - name: remove LICENSES
        run: |
          rm -r ./install_plugins/LICENSES

      - name: deploy debug
        uses: sand4rt/ftp-deployer@v1.3
        with:
          sftp: true
          host: ${{ secrets.DEBUG_HOST }}
          port: ${{ secrets.DEBUG_PORT}}
          username: ${{ secrets.DEBUG_USERNAME }}
          password: ${{ secrets.DEBUG_PASSWORD }}
          remote_folder: /install_plugins/
          local_folder: ./install_plugins/
          cleanup: false

  deploy_stable:
    environment: deploy seichi
    runs-on: ubuntu-latest
    needs: build_stable
    if: "!contains(github.event.head_commit.message, '[deploy skip]')"
    steps:
      - uses: actions/checkout@v2
      - run: mkdir ~/install_plugins
      - name: download
        uses: actions/download-artifact@v2
        with:
          name: CoralReef
          path: install_plugins

      - name: remove LICENSES
        run: |
          rm -r ./install_plugins/LICENSES

      - name: deploy seichi_1
        uses: sand4rt/ftp-deployer@v1.3
        with:
          sftp: true
          host: ${{ secrets.SEICHI_1_HOST }}
          port: ${{ secrets.SEICHI_1_PORT}}
          username: ${{ secrets.SEICHI_1_USERNAME }}
          password: ${{ secrets.SEICHI_1_PASSWORD }}
          remote_folder: /install_plugins/
          local_folder: ./install_plugins/
          cleanup: false

      - name: deploy seichi_2
        uses: sand4rt/ftp-deployer@v1.3
        with:
          sftp: true
          host: ${{ secrets.SEICHI_2_HOST }}
          port: ${{ secrets.SEICHI_2_PORT}}
          username: ${{ secrets.SEICHI_2_USERNAME }}
          password: ${{ secrets.SEICHI_2_PASSWORD }}
          remote_folder: /install_plugins/
          local_folder: ./install_plugins/
          cleanup: false
