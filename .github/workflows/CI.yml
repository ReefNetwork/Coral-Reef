name: CI

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on:
  push:
  pull_request:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[ci skip]')"
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v2

      - name: composer install
        run: composer install -n --no-ansi

      - name: build
        run: |
          git clone https://github.com/poggit/libasynql.git
          mv ./libasynql/libasynql/src/ ./src/ree_jp/coral_reef/libs/
          php -d phar.readonly=0 ./build/make-phar.php ${{ github.run_number }}-${GITHUB_REF##*/} "use poggit\\libasynql\\" "use ree_jp\\coral_reef\\libs\\poggit\\libasynql\\"

      - name: upload
        uses: actions/upload-artifact@v2
        with:
          name: CoralReef
          path: ./build/CoralReef.phar

      - name: LICENSE uploads
        uses: actions/upload-artifact@v2
        with:
          name: LICENSES
          path: ./LICENSES/

  deploy:
    environment: deploy debug
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v2
      - run: mkdir ~/install_plugins
      - name: download
        uses: actions/download-artifact@v2
        with:
          name: CoralReef
          path: install_plugins

      - name: deploy debug
        uses: sand4rt/ftp-deployer@v1.3
        with:
          sftp: true # optional
          host: ${{ secrets.DEBUG_HOST }} # e.g. ftp.host.com or sftp.host.com (without ftp:// or ftps://)
          port: ${{ secrets.DEBUG_PORT}} # optional, default is: 21
          username: ${{ secrets.DEBUG_USERNAME }} # FTP username
          password: ${{ secrets.DEBUG_PASSWORD }} # FTP password
          remote_folder: /install_plugins/ # optional, remote path of your FTP server
          local_folder: ./install_plugins/ # optional, local path, default is: dist
          cleanup: false # optional, remove existing files inside FTP remote folder
